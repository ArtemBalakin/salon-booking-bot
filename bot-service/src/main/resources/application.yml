server:
  port: ${PORT:8080}
  error:
    # Mini App показывает клиенту текст ошибки (слот занят, неверный телефон и т.п.)
    include-message: always

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:booking_bot}
    username: ${DB_USER:booking_bot}
    password: ${DB_PASSWORD:booking_bot}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  base-url: ${APP_BASE_URL:http://localhost:8080}

bot:
  token: ${BOT_TOKEN:}
  username: ${BOT_USERNAME:}
  admin-chat-id: ${ADMIN_CHAT_ID:}
  miniapp-path: /miniapp/index.html
  # true — новые записи ждут подтверждения админа (кнопки в боте);
  # false — записи подтверждаются автоматически. Без ADMIN_CHAT_ID всегда авто.
  manual-confirmation: ${MANUAL_CONFIRMATION:true}

salon:
  name: ${SALON_NAME:Салон красоты}
  address: ${SALON_ADDRESS:}
  work-start-hour: 10
  work-end-hour: 19
  slots-ahead-days: 14

logging:
  level:
    kz.bookingbot: INFO
